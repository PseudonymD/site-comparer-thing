name: Deploy web app to GitHub Pages (legacy, manual only)

# The live site is hosted on Vercel (https://site-comparer-thing.vercel.app), which builds every push to
# main and every pull request. This Pages workflow is kept for reference and only runs when started by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Use data from the latest "data-*" release when present (optional, for data > 50 MB)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName -q '[.[] | select(.tagName | startswith("data-"))][0].tagName' 2>/dev/null || true)
          if [ -n "$tag" ]; then
            echo "Using data release $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir public/data --clobber
          else
            echo "No data release; using committed web/public/data"
          fi
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
