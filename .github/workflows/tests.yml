name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -r requirements.txt pytest
      - run: .venv/bin/python -m pytest -q pipeline/tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test && npm run build
