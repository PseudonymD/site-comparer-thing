<!doctype html>
<html lang="en" data-body="moon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrestrial Analog Finder</title>
    <meta name="description" content="Find places on Earth that best resemble Moon and Mars base sites, re-scored live from 18 open NASA and partner datasets. NASA Space Apps 2026." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8eaed'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%2314181f'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%2314181f'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="loader">
      <div class="loader-inner">
        <div class="eyebrow">Terrestrial Analog Finder</div>
        <div class="loader-title">Where on Earth is most like the Moon and Mars?</div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="loader-label" id="progress-label">Loading 18 Earth-observation layers</div>
      </div>
    </div>

    <main id="map"></main>

    <header id="topbar" class="sheet">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Analog Finder</div>
      <nav class="targets" id="targets" aria-label="Target site"></nav>
      <select id="target-select" aria-label="Target site"></select>
      <button class="text-btn" id="btn-about">How it works</button>
    </header>

    <aside id="left" class="panel sheet" aria-label="Target and controls"></aside>
    <button class="panel-toggle sheet" id="toggle-left" aria-label="Hide controls" title="Hide or show controls"></button>

    <aside id="right" class="panel sheet" aria-label="Candidate sites">
      <div id="list-view">
        <div class="panel-head">
          <h2>Candidates</h2>
          <div class="note" id="sites-sub"></div>
        </div>
        <ol id="sites"></ol>
      </div>
      <section id="dossier" class="hidden" aria-live="polite"></section>
    </aside>
    <button class="panel-toggle sheet" id="toggle-right" aria-label="Hide candidates" title="Hide or show candidates"></button>

    <div id="legend" class="sheet">
      <div class="eyebrow" id="legend-title">Analog score</div>
      <div class="legend-hist" id="legend-hist"></div>
      <div class="legend-ticks"><span id="legend-lo"></span><span id="legend-mid"></span><span id="legend-hi"></span></div>
      <div class="legend-foot" id="legend-foot"></div>
    </div>

    <div id="about" class="hidden"></div>
    <div id="toast" class="hidden sheet" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
