<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrestrial Analog Finder</title>
    <meta name="description" content="Find places on Earth that best resemble Moon and Mars base sites, re-scored live from 18 open NASA and partner datasets. NASA Space Apps 2026." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f8850f'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%23a33c00'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%23a33c00'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="loader">
      <div class="loader-inner">
        <div class="loader-title">Terrestrial Analog Finder</div>
        <div class="loader-sub">Loading 18 Earth-observation layers for every land cell…</div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="loader-label" id="progress-label">starting</div>
      </div>
    </div>

    <header id="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <div class="brand-title">Terrestrial Analog Finder</div>
          <div class="brand-sub">Where on Earth is most like the Moon &amp; Mars?</div>
        </div>
      </div>
      <div class="target-tabs" id="target-tabs"></div>
      <div class="top-actions">
        <button class="btn ghost" id="btn-projection" title="Toggle globe / flat map">Globe</button>
        <button class="btn ghost" id="btn-basemap" title="Toggle satellite / dark basemap">Dark map</button>
        <button class="btn" id="btn-about">About &amp; method</button>
      </div>
    </header>

    <aside id="left" class="panel"></aside>
    <main id="map"></main>
    <aside id="right" class="panel">
      <div class="panel-head">
        <h2>Top candidate sites</h2>
        <div class="muted small" id="sites-sub"></div>
      </div>
      <ol id="sites"></ol>
    </aside>

    <div id="legend">
      <div class="legend-title" id="legend-title">Analog score</div>
      <div class="legend-bar" id="legend-bar"></div>
      <div class="legend-ticks"><span id="legend-lo"></span><span id="legend-hi"></span></div>
      <div class="legend-foot" id="legend-foot"></div>
    </div>

    <section id="card" class="hidden" aria-live="polite"></section>
    <div id="about" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
